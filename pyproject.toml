[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vowely"
dynamic = ["version"]
description = "Private offline Windows push-to-talk dictation"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials>=6.8,<7", "sounddevice>=0.5,<0.6", "comtypes>=1.4,<2; sys_platform == 'win32'", "psutil>=6,<8"]

[project.scripts]
vowely = "localflow.launcher:main"
vowely-bench = "localflow.benchmark:main"
localflow = "localflow.launcher:main"
localflow-bench = "localflow.benchmark:main"

[tool.setuptools.dynamic]
version = {attr = "localflow.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localflow = ["assets/*.png", "assets/*.ico"]
